        /* Hero */
        .hero {

            background: linear-gradient(180deg, rgba(247,223,30,0.06) 0%, transparent 100%);
        }
        .hero-badge {

            font-size: 13px;
            font-weight: 600;
            padding: 6px 16px;

        .stats {

            flex-wrap: wrap;

        .stat-num { font-size: 28px; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 13px; color: var(--text-2); margin-top: 4px; }

        .container {

            margin: 0 auto;
            padding: 48px 24px 80px;
        }
        .chapter {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 24px;
            overflow: hidden;
            transition: var(--transition);
        }
        .chapter:hover { border-color: rgba(247,223,30,0.3); }
        .chapter-header {

            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 16px;

        .chapter-num {

            background: var(--accent);

            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;

        .chapter-title { font-size: 18px; font-weight: 600; }
        .chapter-desc { font-size: 13px; color: var(--text-2); margin-top: 2px; }

            color: var(--text-2);
            background: rgba(255,255,255,0.06);
            padding: 4px 10px;
            border-radius: 12px;
            flex-shrink: 0;
        }
        .chapter-arrow {
            font-size: 18px;
            color: var(--text-2);
            transition: var(--transition);
            flex-shrink: 0;
        }
        .chapter.open .chapter-arrow { transform: rotate(90deg); }
        .lesson-list {
            display: none;
            padding: 0 24px 20px;
        }
        .chapter.open .lesson-list { display: block; }
        .lesson-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-2);
            font-size: 14px;
            transition: var(--transition);
        }
        .lesson-link:hover {
            background: rgba(247,223,30,0.08);
            color: var(--text);
        }
        .lesson-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-2);
            min-width: 28px;
        }
        .lesson-title { flex: 1; }
        .lesson-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 500;

        .tag-challenge { background: rgba(255,85,85,0.15); color: #ff5555; }

            text-align: center;
            padding: 32px;
            font-size: 13px;
            color: var(--text-2);
            border-top: 1px solid var(--border);
