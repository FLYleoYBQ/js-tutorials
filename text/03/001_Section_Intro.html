<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Section Intro</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- Prism.js CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <style>
        :root {
            --bg-color: #0f111a;
            --surface-color: #1a1d27;
            --text-primary: #f8f9fa;
            --text-secondary: #a0aec0;
            --accent-color: #3b82f6;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        body { margin: 0; font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-primary); line-height: 1.6; display: flex; }
        .app-container { display: flex; width: 100%; min-height: 100vh; }
        .sidebar { width: 280px; background-color: var(--surface-color); border-right: 1px solid var(--border-color); padding: 24px; position: sticky; top: 0; height: 100vh; overflow-y: auto; box-sizing: border-box;}
        .sidebar-title { font-size: 14px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 24px; }
        .nav-item { display: block; padding: 10px 16px; color: var(--text-secondary); text-decoration: none; border-radius: 8px; margin-bottom: 8px; transition: all 0.2s ease; }
        .nav-item:hover, .nav-item.active { background-color: rgba(59, 130, 246, 0.1); color: var(--accent-color); }
        .main-content { flex: 1; padding: 48px; max-width: 800px; margin: 0 auto; box-sizing: border-box;}
        h1 { font-size: 32px; margin-bottom: 16px; font-weight: 700; }
        h2 { font-size: 24px; margin-top: 48px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .meta-info { display: flex; gap: 16px; margin-bottom: 32px; color: var(--text-secondary); font-size: 14px;}
        .callout { background-color: rgba(59, 130, 246, 0.1); border-left: 4px solid var(--accent-color); padding: 16px; border-radius: 0 8px 8px 0; margin: 24px 0; }
    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">第 03 章 / 概述</div>
        </div>
        <nav id="toc">
            <a href="#section-overview" class="nav-item active">概述</a>
        </nav>
    </aside>

    <main class="main-content">
        <h1>Section Intro</h1>
        
        <div class="meta-info">
            <span>📺 来源：001 Section Intro.en.srt</span>
            <span>📂 章节：第 03 章</span>
        </div>

        <h2 id="section-overview">🎯 概述</h2>
        <p>欢迎来到 JavaScript 的进阶世界！在这一章中，我们将进入 JavaScript 核心基础的第二部分，探索更多激动人心的高级特性。准备好了吗？让我们开始吧！</p>

    </main>
</div>

</body>
</html>
